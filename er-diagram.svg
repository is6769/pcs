<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="730" viewBox="0 0 1160 730">
  <rect width="1160" height="730" fill="#f4f7fb"/>
  <g font-family="Arial, sans-serif">
    <text x="50" y="55" font-size="28" font-weight="bold" fill="#183153">S-Cloud · Облачный провайдер</text>
    <text x="50" y="86" font-size="17" fill="#53657b">ER-диаграмма PostgreSQL · клиент и заявка на облачный ресурс</text>
    <rect x="50" y="140" width="370" height="255" rx="12" fill="white" stroke="#bbcadd"/>
    <path d="M62 140 H408 Q420 140 420 152 V198 H50 V152 Q50 140 62 140" fill="#183153"/>
    <text x="72" y="177" font-size="23" fill="white" font-weight="bold">clients</text>
    <g x="72" font-size="18" fill="#183153">
      <text x="72" y="231">PK  id : BIGINT</text>
      <text x="72" y="269">name : VARCHAR(120)</text>
      <text x="72" y="307">UK  email : VARCHAR(254)</text>
      <text x="72" y="345">company : VARCHAR(150)</text>
      <text x="72" y="378" font-size="14" fill="#53657b">Все поля NOT NULL</text>
    </g>
    <rect x="660" y="140" width="450" height="515" rx="12" fill="white" stroke="#bbcadd"/>
    <path d="M672 140 H1098 Q1110 140 1110 152 V198 H660 V152 Q660 140 672 140" fill="#183153"/>
    <text x="682" y="177" font-size="23" fill="white" font-weight="bold">resource_requests</text>
    <g font-size="18" fill="#183153">
      <text x="682" y="231">PK  id : BIGINT</text>
      <text x="682" y="266" font-weight="bold" fill="#007a78">FK  client_id : BIGINT</text>
      <text x="682" y="301">title : VARCHAR(150)</text>
      <text x="682" y="336">description : VARCHAR(2000)</text>
      <text x="682" y="371">resource_type : VARCHAR(30)</text>
      <text x="682" y="406">region : VARCHAR(20)</text>
      <text x="682" y="441">cpu : INTEGER</text>
      <text x="682" y="476">ram_gb : INTEGER</text>
      <text x="682" y="511">storage_gb : INTEGER</text>
      <text x="682" y="546">status : VARCHAR(20)</text>
      <text x="682" y="581">created_at : TIMESTAMP</text>
      <text x="682" y="616">version : INTEGER</text>
      <text x="682" y="642" font-size="14" fill="#53657b">Все поля NOT NULL · enum и ёмкости: CHECK</text>
    </g>
    <path d="M420 259 H660 M435 246 V272 M445 246 V272 M640 259 L660 243 M640 259 L660 275" fill="none" stroke="#007a78" stroke-width="2.5"/>
    <circle cx="624" cy="259" r="6" fill="#f4f7fb" stroke="#007a78" stroke-width="2.5"/>
    <text x="470" y="235" font-size="18" fill="#007a78">1 → 0..N</text>
    <text x="455" y="301" font-size="15" fill="#53657b">ON DELETE RESTRICT</text>
    <text x="50" y="700" font-size="16" fill="#53657b">PK — первичный ключ · FK — внешний ключ · UK — уникальное значение</text>
  </g>
</svg>
