name: s-cloud
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cloud_provider
      POSTGRES_USER: cloud
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cloud_dev_password}
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloud -d cloud_provider"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
